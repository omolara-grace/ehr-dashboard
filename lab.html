<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Module - GoodLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">GoodLife</a>
      <span class="navbar-text text-white">Lab Module</span>
    </div>
  </nav>

  <div class="container mt-4">
    <h3 class="mb-4">Laboratory Tests</h3>

    <form id="labForm" class="mb-4 p-3 bg-white rounded shadow-sm">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Patient Name</label>
          <input type="text" class="form-control" id="patientName" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Test Type</label>
          <input type="text" class="form-control" id="testType" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Date Requested</label>
          <input type="date" class="form-control" id="testDate" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-3">Add Test</button>
    </form>

    <table class="table table-bordered table-hover bg-white shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>Patient Name</th>
          <th>Test Type</th>
          <th>Date Requested</th>
          <th>Status</th>
          <th>Result Details</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="labTableBody"></tbody>
    </table>
  </div>

  <script>
    let labTests = JSON.parse(localStorage.getItem('labTests')) || [];

    function renderTable() {
      const tableBody = document.getElementById('labTableBody');
      tableBody.innerHTML = '';

      labTests.forEach((test, index) => {
        tableBody.innerHTML += `
          <tr>
            <td>${test.patientName}</td>
            <td>${test.testType}</td>
            <td>${test.testDate}</td>
            <td>${test.status}</td>
            <td>${test.result || '-'}</td>
            <td>
              ${test.status === 'Pending' ? 
                `<button class="btn btn-success btn-sm" onclick="markCompleted(${index})">Mark Completed</button>` 
                : '<span class="text-success fw-bold">✔ Done</span>'
              }
              <button class="btn btn-danger btn-sm ms-2" onclick="deleteTest(${index})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById('labForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const newTest = {
        patientName: document.getElementById('patientName').value,
        testType: document.getElementById('testType').value,
        testDate: document.getElementById('testDate').value,
        status: 'Pending',
        result: ''
      };
      labTests.push(newTest);
      localStorage.setItem('labTests', JSON.stringify(labTests));
      renderTable();
      this.reset();
    });

    function markCompleted(index) {
      const result = prompt("Enter the test result details:");
      if (result) {
        labTests[index].status = 'Completed';
        labTests[index].result = result;
        localStorage.setItem('labTests', JSON.stringify(labTests));
        renderTable();
        alert("Test marked as completed!");
      } else {
        alert("Result details are required to complete this test.");
      }
    }

    function deleteTest(index) {
      if (confirm("Are you sure you want to delete this test record?")) {
        labTests.splice(index, 1);
        localStorage.setItem('labTests', JSON.stringify(labTests));
        renderTable();
      }
    }

    
    renderTable();
  </script>

</body>
</html>
