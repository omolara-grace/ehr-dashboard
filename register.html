<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Patient - GoodLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .passport-preview {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      border: 2px solid #ddd;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">GoodLife - Register Patient</span>
      <a href="dashboard.html" class="btn btn-light btn-sm">Back to Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow p-4">
      <h4 class="mb-3 text-center text-primary">Patient Registration Form</h4>
      <form id="patientForm">

        <div class="mb-3">
          <label class="form-label">Title</label>
          <select id="title" class="form-select" required>
            <option value="">Select Title</option>
            <option>Mr</option>
            <option>Mrs</option>
            <option>Miss</option>
            <option>Dr</option>
            <option>Prof</option>
            <option>Father</option>
            <option>Sister</option>
            <option>Rev.</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="number" class="form-control" placeholder="e.g. 08012345678" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. example@gmail.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Age</label>
          <input type="number" id="age" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Gender</label>
          <select id="gender" class="form-select" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Nationality</label>
          <select id="nationality" class="form-select" required>
            <option value="">Select Nationality</option>
            <option>Nigerian</option>
            <option>Ghanaian</option>
            <option>Cameroonian</option>
            <option>Beninese</option>
            <option>Other</option>
          </select>
        </div>

       
        <div class="mb-3">
          <label class="form-label">State of Origin</label>
          <select id="state" class="form-select" required>
            <option value="">Select State</option>
            <option>Abia</option><option>Adamawa</option><option>Akwa Ibom</option>
            <option>Anambra</option><option>Bauchi</option><option>Bayelsa</option>
            <option>Benue</option><option>Borno</option><option>Cross River</option>
            <option>Delta</option><option>Ebonyi</option><option>Edo</option>
            <option>Ekiti</option><option>Enugu</option><option>FCT - Abuja</option>
            <option>Gombe</option><option>Imo</option><option>Jigawa</option>
            <option>Kaduna</option><option>Kano</option><option>Katsina</option>
            <option>Kebbi</option><option>Kogi</option><option>Kwara</option>
            <option>Lagos</option><option>Nasarawa</option><option>Niger</option>
            <option>Ogun</option><option>Ondo</option><option>Osun</option>
            <option>Oyo</option><option>Plateau</option><option>Rivers</option>
            <option>Sokoto</option><option>Taraba</option><option>Yobe</option>
            <option>Zamfara</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Marital Status</label>
          <select id="status" class="form-select">
            <option value="">Marital Status</option>
            <option>Single</option>
             <option>Married</option>
              <option>Divorced</option>
               <option>Widow</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Home Address</label>
          <textarea id="address" class="form-control" rows="2" required></textarea>
        </div>

       
        <div class="mb-3">
          <label class="form-label">Upload Passport</label>
          <input type="file" id="passport" class="form-control" accept="image/*" required>
          <div class="mt-2">
            <img id="preview" class="passport-preview" src="" alt="">
          </div>
        </div>

        
        <div class="mb-3">
          <label class="form-label">Medical Condition</label>
          <input type="text" id="condition" class="form-control" required>
        </div>

        <h5 class="text-secondary mt-4">Next of Kin Details</h5>
        <div class="mb-3">
          <label class="form-label">Next of Kin Name</label>
          <input type="text" id="nokName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Relationship</label>
          <input type="text" id="nokRelationship" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Next of Kin Phone</label>
          <input type="tel" id="nokPhone" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success w-100">Save Patient</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("passport").addEventListener("change", function(e) {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById("preview").src = reader.result;
      }
      if (file) reader.readAsDataURL(file);
    });

    document.getElementById("patientForm").addEventListener("submit", function(e) {
      e.preventDefault();

    
      const title = document.getElementById("title").value;
      const name = document.getElementById("name").value;
      const number = document.getElementById("number").value;
      const email = document.getElementById("email").value;
      const age = document.getElementById("age").value;
      const gender = document.getElementById("gender").value;
      const nationality = document.getElementById("nationality").value;
      const state = document.getElementById("state").value;
      const status = document.getElementById("status").value;
      const address = document.getElementById("address").value;
      const condition = document.getElementById("condition").value;
      const passport = document.getElementById("preview").src;
      const nokName = document.getElementById("nokName").value;
      const nokRelationship = document.getElementById("nokRelationship").value;
      const nokPhone = document.getElementById("nokPhone").value;

      let patients = JSON.parse(localStorage.getItem("patients")) || [];

      let newIdNumber = patients.length + 1;
      let patientId = "A" + String(newIdNumber).padStart(5, "0");

      const patient = {
        id: patientId,
        title,
        name,
        phone,
        email,
        age,
        gender,
        nationality,
        state,
        status,
        address,
        condition,
        passport,
        nextOfKin: {
          name: nokName,
          relationship: nokRelationship,
          phone: nokPhone
        }
      };

      patients.push(patient);
      patients.sort((a, b) => a.name.localeCompare(b.name));
      localStorage.setItem("patients", JSON.stringify(patients));

      alert(" Patient saved successfully!");
      document.getElementById("patientForm").reset();
      document.getElementById("preview").src = "";
    });
  </script>
</body>
</html>
