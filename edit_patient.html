<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Patient - GoodLife</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body style="background-color:#f8f9fa;">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">GoodLife - Edit Patient</span>
      <a href="records.html" class="btn btn-light btn-sm">Back to Records</a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow p-4">
      <h4 class="mb-3 text-center">Edit Patient Information</h4>
      <form id="editForm">
        <div class="row mb-3">
          <div class="col-md-3">
            <label class="form-label">Title</label>
            <select id="title" class="form-select">
              <option>Mr</option>
              <option>Mrs</option>
              <option>Miss</option>
              <option>Dr</option>
            </select>
          </div>
          <div class="col-md-9">
            <label class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control" required />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Age</label>
            <input type="number" id="age" class="form-control" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Gender</label>
            <select id="gender" class="form-select">
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">State of Origin</label>
            <input type="text" id="state" class="form-control" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" id="address" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="text" id="number" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Medical Condition</label>
          <input type="text" id="condition" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Next of Kin</label>
          <input type="text" id="nextOfKin" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Passport</label>
          <input type="file" id="passport" class="form-control" accept="image/*" />
          <img id="previewImage" src="" alt="Passport Preview" width="100" class="mt-2 rounded shadow-sm d-block" />
        </div>

        <button type="submit" class="btn btn-success w-100">Save Changes</button>
      </form>
    </div>
  </div>

  <script>
    const editPatient = JSON.parse(localStorage.getItem("editPatient"));
    if (!editPatient) {
      alert("No patient selected for editing!");
      window.location.href = "records.html";
    }

    document.getElementById("title").value = editPatient.title;
    document.getElementById("name").value = editPatient.name;
    document.getElementById("age").value = editPatient.age;
    document.getElementById("gender").value = editPatient.gender;
    document.getElementById("address").value = editPatient.address;
    document.getElementById("number").value = editPatient.number;
    document.getElementById("state").value = editPatient.state;
    document.getElementById("condition").value = editPatient.condition;
    document.getElementById("nextOfKin").value = editPatient.nextOfKin;
    document.getElementById("previewImage").src = editPatient.passport;

    document.getElementById("editForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const patients = JSON.parse(localStorage.getItem("patients")) || [];
      const updatedPassport = document.getElementById("passport").files[0];

      if (updatedPassport) {
        const reader = new FileReader();
        reader.onload = function(event) {
          saveUpdatedPatient(event.target.result);
        };
        reader.readAsDataURL(updatedPassport);
      } else {
        saveUpdatedPatient(editPatient.passport);
      }

      function saveUpdatedPatient(passportData) {
        const updatedPatient = {
          id: editPatient.id,
          title: document.getElementById("title").value,
          name: document.getElementById("name").value,
          age: document.getElementById("age").value,
          gender: document.getElementById("gender").value,
          address: document.getElementById("address").value, 
          number: document.getElementById("number").value,
          state: document.getElementById("state").value,
          condition: document.getElementById("condition").value,
          nextOfKin: document.getElementById("nextOfKin").value,
          passport: passportData
        };

        const index = patients.findIndex(p => p.id === editPatient.id);
        if (index !== -1) {
          patients[index] = updatedPatient;
          localStorage.setItem("patients", JSON.stringify(patients));
          localStorage.removeItem("editPatient");
          alert("Patient record updated successfully!");
          window.location.href = "records.html";
        }
      }
    });
  </script>
</body>
</html>
