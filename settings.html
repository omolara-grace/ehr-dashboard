<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - GoodLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">GoodLife - Settings</span>
      <a href="index.html" class="btn btn-light btn-sm">Back to Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow p-3">
          <h5 class="text-primary mb-3">👤 Profile Settings</h5>
          <form id="profileForm">
            <div class="mb-3">
              <label for="name" class="form-label">Admin Name</label>
              <input type="text" id="name" class="form-control" placeholder="Enter full name">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" placeholder="Enter email">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-control" placeholder="Enter new password">
            </div>
            <button type="button" class="btn btn-success" onclick="saveProfile()">Save Changes</button>
          </form>
        </div>
      </div>

      
      <div class="col-md-6">
        <div class="card shadow p-3">
          <h5 class="text-primary mb-3">System Settings</h5>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="darkModeToggle" onchange="toggleTheme()">
            <label class="form-check-label" for="darkModeToggle">Enable Dark Mode</label>
          </div>
          <div class="mb-3">
            <label class="form-label">Data Backup</label>
            <button class="btn btn-outline-primary btn-sm w-100" onclick="backupData()">Backup Now</button>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="notificationsToggle" onchange="toggleNotifications()">
            <label class="form-check-label" for="notificationsToggle">Enable Notifications</label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.onload = function () {
      const profile = JSON.parse(localStorage.getItem("adminProfile"));
      if (profile) {
        document.getElementById("name").value = profile.name;
        document.getElementById("email").value = profile.email;
        document.getElementById("password").value = profile.password;
      }

      const darkMode = localStorage.getItem("darkMode") === "true";
      document.getElementById("darkModeToggle").checked = darkMode;
      if (darkMode) document.body.classList.add("bg-dark", "text-white");

      document.getElementById("notificationsToggle").checked =
        localStorage.getItem("notificationsEnabled") === "true";
    };

    function saveProfile() {
      const profile = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      };
      localStorage.setItem("adminProfile", JSON.stringify(profile));
      alert("Profile updated successfully!");
    }

    function toggleTheme() {
      const isDark = document.getElementById("darkModeToggle").checked;
      localStorage.setItem("darkMode", isDark);
      document.body.classList.toggle("bg-dark", isDark);
      document.body.classList.toggle("text-white", isDark);
    }

    function toggleNotifications() {
      const enabled = document.getElementById("notificationsToggle").checked;
      localStorage.setItem("notificationsEnabled", enabled);
      alert(enabled ? " Notifications enabled!" : "Notifications disabled!");
    }

    function backupData() {
      alert("Data backup created successfully!");
    }
  </script>

</body>
</html>
