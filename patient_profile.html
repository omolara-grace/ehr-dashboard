<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#f4f6f9">

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-primary">

<div class="container-fluid">

<span class="navbar-brand">GoodLife Hospital - Patient Profile</span>

<a href="patient_records.html" class="btn btn-light btn-sm">
Back to Records
</a>

</div>

</nav>


<div class="container mt-4">

<div class="card shadow-lg">

<div class="card-body">


<div class="row">

<!-- PASSPORT -->

<div class="col-md-4 text-center">

<img id="passport"
class="img-fluid rounded shadow"
style="width:200px;height:200px;object-fit:cover">

<h5 class="mt-3 text-primary" id="patientName"></h5>

<p id="patientId" class="text-muted"></p>

</div>


<!-- PATIENT DETAILS -->

<div class="col-md-8">

<h4 class="text-primary mb-3">Patient Information</h4>

<table class="table table-bordered">

<tr>
<th>Age</th>
<td id="age"></td>
</tr>

<tr>
<th>Gender</th>
<td id="gender"></td>
</tr>

<tr>
<th>Phone</th>
<td id="phone"></td>
</tr>

<tr>
<th>Email</th>
<td id="email"></td>
</tr>

<tr>
<th>Address</th>
<td id="address"></td>
</tr>

<tr>
<th>State</th>
<td id="state"></td>
</tr>

<tr>
<th>Medical Condition</th>
<td id="condition"></td>
</tr>

</table>


<h5 class="text-primary mt-4">Next of Kin</h5>

<table class="table table-bordered">

<tr>
<th>Name</th>
<td id="kinName"></td>
</tr>

<tr>
<th>Relationship</th>
<td id="kinRelationship"></td>
</tr>

<tr>
<th>Phone</th>
<td id="kinPhone"></td>
</tr>

</table>


<div class="mt-4">

<button class="btn btn-warning" onclick="editPatient()">
Edit Patient
</button>

</div>

</div>

</div>

</div>

</div>

</div>



<script>

const patient = JSON.parse(localStorage.getItem("selectedPatient"));

if(!patient){

alert("No patient selected");

window.location.href="patient_records.html";

}

document.getElementById("passport").src = patient.passport;

document.getElementById("patientName").innerText = patient.name;

document.getElementById("patientId").innerText = "Registration No: " + patient.id;

document.getElementById("age").innerText = patient.age;

document.getElementById("gender").innerText = patient.gender;

document.getElementById("phone").innerText = patient.phone || "N/A";

document.getElementById("email").innerText = patient.email || "N/A";

document.getElementById("address").innerText = patient.address;

document.getElementById("state").innerText = patient.state;

document.getElementById("condition").innerText = patient.condition;


if(patient.nextOfKin){

document.getElementById("kinName").innerText = patient.nextOfKin.name;

document.getElementById("kinRelationship").innerText = patient.nextOfKin.relationship;

document.getElementById("kinPhone").innerText = patient.nextOfKin.phone;

}


function editPatient(){

localStorage.setItem("editPatient", JSON.stringify(patient));

window.location.href="edit_patient.html";

}

</script>


</body>
</html>
