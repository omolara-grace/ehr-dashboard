<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoodLife Login</title>
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->

  <style>
    body {
      background: linear-gradient(135deg, #007bff, #28a745);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }

    .login-card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      text-align: center;
    }

    .login-card h3 {
      font-weight: 600;
      color: #007bff;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: #28a745;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-control {
      border-radius: 10px;
      padding: 10px 15px;
    }

    .btn-login {
      background-color: #007bff;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      color: #fff;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
    }

    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h3>GoodLife</h3>
    <p class="tagline">Your Digital Health Companion</p>

    <!-- Make sure to use onsubmit exactly like this -->
    <form id="loginForm">
      <div class="mb-3 text-start">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
      </div>

      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-login">Login</button>
    </form>
  </div>

  <footer>
    &copy; 2025 GoodLife Health Systems
  </footer>

  <script>
    // Attach event listener after DOM loads
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault(); // stops the page from reloading

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username === "admin" && password === "admin123") {
        alert("Login Successful!");
        localStorage.setItem("loggedIn", true);
        window.location.href = "dashboard.html"; // redirect works
      } else {
        alert("Invalid username or password.");
      }
    });
  </script>

</body>
</html>
