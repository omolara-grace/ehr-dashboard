<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Staff - GoodLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .passport-preview {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      border: 2px solid #ddd;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">GoodLife - Edit Staff</span>
      <a href="staff.html" class="btn btn-light btn-sm">Back to Staff List</a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow p-4 mb-5">
      <h4 class="text-center text-primary mb-3">Edit Staff Information</h4>

      <form id="editStaffForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" id="editStaffName" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Department</label>
            <select id="editStaffRole" class="form-select" required>
              <option value="">Select Department</option>
              <optgroup label="Medical">
                <option>Doctor</option>
                <option>Nurse</option>
                <option>Lab Technician</option>
                <option>Pharmacist</option>
              </optgroup>
              <optgroup label="Administrative">
                <option>Receptionist</option>
                <option>Intern Staff</option>
              </optgroup>
              <optgroup label="Technical / IT">
                <option>InfoTech Staff</option>
              </optgroup>
              <optgroup label="Maintenance / Support">
                <option>Maintenance</option>
                <option>Cleaner</option>
                <option>Security</option>
              </optgroup>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="editStaffPhone" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" id="editStaffEmail" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">Gender</label>
            <select id="editStaffGender" class="form-select" required>
              <option value="">Select Gender</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Change Passport</label>
            <input type="file" id="editStaffPassport" class="form-control" accept="image/*">
            <div class="mt-2">
              <img id="editStaffPreview" class="passport-preview" src="" alt="">
            </div>
          </div>
        </div>

        <button class="btn btn-success w-100 mt-4" type="submit">Update Staff</button>
      </form>
    </div>
  </div>

  <script>
    let staffToEdit = JSON.parse(localStorage.getItem("editStaff")) || null;

    document.addEventListener("DOMContentLoaded", function() {
      if (!staffToEdit) {
        alert("No staff record found!");
        window.location.href = "staff.html";
        return;
      }

      document.getElementById("editStaffName").value = staffToEdit.name || "";
      document.getElementById("editStaffRole").value = staffToEdit.role || "";
      document.getElementById("editStaffPhone").value = staffToEdit.phone || "";
      document.getElementById("editStaffEmail").value = staffToEdit.email || "";
      document.getElementById("editStaffGender").value = staffToEdit.gender || "";
      document.getElementById("editStaffPreview").src = staffToEdit.passport || "";

      document.getElementById("editStaffPassport").addEventListener("change", function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function() {
          document.getElementById("editStaffPreview").src = reader.result;
        };
        if (file) reader.readAsDataURL(file);
      });
    });

    document.getElementById("editStaffForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let staffList = JSON.parse(localStorage.getItem("staffList")) || [];

      const updatedStaff = {
        id: staffToEdit.id,
        name: document.getElementById("editStaffName").value,
        role: document.getElementById("editStaffRole").value,
        phone: document.getElementById("editStaffPhone").value,
        email: document.getElementById("editStaffEmail").value,
        gender: document.getElementById("editStaffGender").value,
        passport: document.getElementById("editStaffPreview").src
      };

      const index = staffList.findIndex(s => s.id === staffToEdit.id);
      if (index !== -1) {
        staffList[index] = updatedStaff;
        localStorage.setItem("staffList", JSON.stringify(staffList));
        alert("Staff record updated successfully!");
        window.location.href = "staff.html";
      } else {
        alert(" Error updating staff record!");
      }
    });
  </script>
</body>
</html>
