<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management - GoodLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .passport-preview {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      border: 2px solid #ddd;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">GoodLife - Staff Management</span>
      <a href="index.html" class="btn btn-light btn-sm">Back to Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow p-4 mb-5">
      <h4 class="text-center text-primary mb-3">Register New Staff</h4>
      <form id="staffForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" id="staffName" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Department</label>
            <select id="staffRole" class="form-select" required>
              <option value="">Select Department</option>
              <optgroup label="Medical">
                <option>Doctor</option>
                <option>Nurse</option>
                <option>Lab Technician</option>
                <option>Pharmacist</option>
              </optgroup>
              <optgroup label="Administrative">
                <option>Receptionist</option>
                <option>Intern Staff</option>
              </optgroup>
              <optgroup label="Technical / IT">
                <option>InfoTech Staff</option>
              </optgroup>
              <optgroup label="Maintenance / Support">
                <option>Maintenance</option>
                <option>Cleaner</option>
                <option>Security</option>
              </optgroup>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="staffPhone" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" id="staffEmail" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Gender</label>
            <select id="staffGender" class="form-select" required>
              <option value="">Select Gender</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Upload Passport</label>
            <input type="file" id="staffPassport" class="form-control" accept="image/*" required>
            <div class="mt-2">
              <img id="staffPreview" class="passport-preview" src="" alt="">
            </div>
          </div>
        </div>
        <button class="btn btn-success w-100 mt-4" type="submit">Save Staff</button>
      </form>
    </div>

    
    <div class="card shadow p-4">
      <h5 class="text-center text-primary mb-3">Registered Staff</h5>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-primary">
            <tr>
              <th>Staff ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Gender</th>
              <th>Passport</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="staffTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("staffPassport").addEventListener("change", function(e) {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById("staffPreview").src = reader.result;
      }
      if (file) reader.readAsDataURL(file);
    });

    
    function loadStaff() {
      const staffList = JSON.parse(localStorage.getItem("staffList")) || [];
      const tableBody = document.getElementById("staffTableBody");
      tableBody.innerHTML = "";

      staffList.forEach((staff, index) => {
        tableBody.innerHTML += `
          <tr>
            <td>${staff.id}</td>
            <td>${staff.name}</td>
            <td>${staff.role}</td>
            <td>${staff.phone}</td>
            <td>${staff.email}</td>
            <td>${staff.gender}</td>
            <td><img src="${staff.passport}" width="50" height="50" style="border-radius:5px;object-fit:cover;"></td>
            <td>
              <button class="btn btn-warning btn-sm" onclick="editStaff(${index})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteStaff(${index})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    
    document.getElementById("staffForm").addEventListener("submit", function(e) {
      e.preventDefault();

      let staffList = JSON.parse(localStorage.getItem("staffList")) || [];

      const newStaff = {
        id: "S" + String(staffList.length + 1).padStart(4, "0"),
        name: document.getElementById("staffName").value,
        role: document.getElementById("staffRole").value,
        phone: document.getElementById("staffPhone").value,
        email: document.getElementById("staffEmail").value,
        gender: document.getElementById("staffGender").value,
        passport: document.getElementById("staffPreview").src
      };

      staffList.push(newStaff);
      localStorage.setItem("staffList", JSON.stringify(staffList));
      alert("Staff saved successfully!");
      document.getElementById("staffForm").reset();
      document.getElementById("staffPreview").src = "";
      loadStaff();
    });

    
    function deleteStaff(index) {
      const staffList = JSON.parse(localStorage.getItem("staffList")) || [];
      if (confirm("Are you sure you want to delete this staff?")) {
        staffList.splice(index, 1);
        localStorage.setItem("staffList", JSON.stringify(staffList));
        loadStaff();
      }
    }

    
    function editStaff(index) {
      const staffList = JSON.parse(localStorage.getItem("staffList")) || [];
      const staff = staffList[index];
      localStorage.setItem("editStaff", JSON.stringify(staff));
      window.location.href = "edit_staff.html";
    }

    loadStaff();
  </script>
</body>
</html>
