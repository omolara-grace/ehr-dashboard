<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Doctor - GoodLife</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .passport-preview {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      border: 2px solid #ddd;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">GoodLife - Register Doctor</span>
      <a href="doctors.html" class="btn btn-light btn-sm">Back to Doctors List</a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow p-4">
      <h4 class="mb-3 text-center text-primary">Doctor Registration Form</h4>
      <form id="doctorForm">
        
        <!-- Passport Upload -->
        <div class="mb-3 text-center">
          <label class="form-label">Upload Passport</label>
          <input type="file" id="passport" class="form-control" accept="image/*" required>
          <div class="mt-2">
            <img id="preview" class="passport-preview" src="" alt="Passport Preview">
          </div>
        </div>

        <!-- Doctor Details -->
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Specialization</label>
          <input type="text" id="specialization" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="phone" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Duty Shift</label>
          <select id="shift" class="form-select" required>
            <option value="">Select Shift</option>
            <option>Morning</option>
            <option>Afternoon</option>
            <option>Night</option>
          </select>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="onDuty">
          <label class="form-check-label">Currently On Duty</label>
        </div>

        <button type="submit" class="btn btn-success w-100">Save Doctor</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("passport").addEventListener("change", function(e) {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById("preview").src = reader.result;
      }
      if (file) reader.readAsDataURL(file);
    });

  
    document.getElementById("doctorForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const specialization = document.getElementById("specialization").value;
      const phone = document.getElementById("phone").value;
      const email = document.getElementById("email").value;
      const shift = document.getElementById("shift").value;
      const onDuty = document.getElementById("onDuty").checked;
      const passport = document.getElementById("preview").src;

      let doctors = JSON.parse(localStorage.getItem("doctors")) || [];

     
      const newId = "D" + String(doctors.length + 1).padStart(5, "0");

      const doctor = {
        id: newId,
        name,
        specialization,
        phone,
        email,
        shift,
        onDuty,
        passport
      };

      doctors.push(doctor);
      localStorage.setItem("doctors", JSON.stringify(doctors));

      alert(" Doctor registered successfully!");
      window.location.href = "doctors.html";
    });
  </script>
</body>
</html>
